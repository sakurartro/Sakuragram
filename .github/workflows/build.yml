name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout sources and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            build-tools;37.0.0
            platforms;android-37
            ndk;27.3.13750724
            cmake;4.0.2

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in API_ID API_HASH GOOGLE_SERVICES_JSON KEYSTORE_JKS KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions secret $name is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::API_ID must contain digits only"
            exit 1
          fi
          if [[ ! "$API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::API_HASH must contain 32 hexadecimal characters"
            exit 1
          fi

      - name: Configure Firebase and signing
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          printf '%s' "$KEYSTORE_JKS" | base64 --decode > "$RUNNER_TEMP/sakuragram.jks"

          expected_package="$(awk -F= '$1 == "APP_PACKAGE" { print $2 }' gradle.properties)"
          if ! jq -e --arg package "$expected_package" \
            'any(.client[]; .client_info.android_client_info.package_name == $package)' \
            TMessagesProj_App/google-services.json > /dev/null; then
            echo "::error::google-services.json does not contain package $expected_package"
            exit 1
          fi

          if ! keytool -list \
            -keystore "$RUNNER_TEMP/sakuragram.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" > /dev/null; then
            echo "::error::The keystore, passwords or key alias are invalid"
            exit 1
          fi

          {
            printf 'apiId=%s\n' "$API_ID"
            printf 'apiHash=%s\n' "$API_HASH"
            printf 'helperBotId=0\n'
            printf 'helperBotUsername=\n'
            printf 'sentryDsn=\n'
            printf 'mapsApiKey=\n'
            printf 'storeFile=%s\n' "$RUNNER_TEMP/sakuragram.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > local.properties

      - name: Configure Gradle for an 8 GB runner
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          {
            printf 'org.gradle.caching=true\n'
            printf 'org.gradle.parallel=false\n'
            printf 'org.gradle.workers.max=2\n'
            printf 'org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:+UseParallelGC\n'
          } >> "$HOME/.gradle/gradle.properties"

      - name: Build signed arm64-v8a release APK
        run: ./gradlew --no-daemon --stacktrace -PbuildAbis=arm64-v8a assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
